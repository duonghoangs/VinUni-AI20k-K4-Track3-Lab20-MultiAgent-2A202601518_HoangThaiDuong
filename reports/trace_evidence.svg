<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Successful multi-agent workflow trace</title>
  <desc id="desc">Supervisor routes through Researcher, Analyst, Writer, then Done. All nodes complete successfully using offline evidence.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2e6f4f"/>
    </marker>
    <style>
      .title { font: 700 24px system-ui, sans-serif; fill: #173426; }
      .label { font: 700 17px system-ui, sans-serif; fill: #173426; }
      .meta { font: 14px system-ui, sans-serif; fill: #4c6257; }
      .box { fill: #eef4f0; stroke: #2e6f4f; stroke-width: 3; rx: 16; }
      .done { fill: #2e6f4f; stroke: #173426; stroke-width: 3; rx: 16; }
      .done-label { font: 700 17px system-ui, sans-serif; fill: #ffffff; }
      .edge { stroke: #2e6f4f; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="320" fill="#fbfcfa"/>
  <text x="50" y="50" class="title">Multi-Agent Trace Evidence</text>
  <text x="50" y="78" class="meta">Status: success · provider: OpenRouter · route iterations: 4</text>

  <line x1="250" y1="165" x2="315" y2="165" class="edge"/>
  <line x1="505" y1="165" x2="570" y2="165" class="edge"/>
  <line x1="760" y1="165" x2="825" y2="165" class="edge"/>
  <line x1="1015" y1="165" x2="1080" y2="165" class="edge"/>

  <rect x="50" y="115" width="200" height="100" class="box"/>
  <text x="150" y="155" text-anchor="middle" class="label">Supervisor</text>
  <text x="150" y="183" text-anchor="middle" class="meta">route: researcher</text>

  <rect x="315" y="115" width="190" height="100" class="box"/>
  <text x="410" y="155" text-anchor="middle" class="label">Researcher</text>
  <text x="410" y="183" text-anchor="middle" class="meta">5 cited sources</text>

  <rect x="570" y="115" width="190" height="100" class="box"/>
  <text x="665" y="155" text-anchor="middle" class="label">Analyst</text>
  <text x="665" y="183" text-anchor="middle" class="meta">evidence assessed</text>

  <rect x="825" y="115" width="190" height="100" class="box"/>
  <text x="920" y="155" text-anchor="middle" class="label">Writer</text>
  <text x="920" y="183" text-anchor="middle" class="meta">citations validated</text>

  <rect x="1080" y="115" width="90" height="100" class="done"/>
  <text x="1125" y="171" text-anchor="middle" class="done-label">Done</text>

  <text x="50" y="275" class="meta">Raw evidence: reports/traces/multi-agent-1.json · Generated by benchmark command</text>
</svg>
